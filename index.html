<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abhyasa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#1d4ed8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Abhyasa">
<style>
:root{--bg:#fff;--ink:#1c1c1e;--mut:#6b7280;--line:#ececf0;--btn:#f2f2f5;--acc:#1d4ed8;--on-acc:#fff;--sc:var(--acc);--c1:#1d4ed8;--c2:#6d28d9;--c3:#9a3412;--c4:#115e59;--c5:#9d174d;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0f0f10;--ink:#f2f2f3;--mut:#a0a0aa;--line:#26262a;--btn:#1d1d20;--acc:#8ab8ff;--on-acc:#0b1220;--c1:#a6ccff;--c2:#cdbcff;--c3:#ffc99a;--c4:#86ead9;--c5:#ffb0cc}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;padding:28px 20px 56px;max-width:560px;margin:0 auto}
h1{font-size:32px;font-weight:700;letter-spacing:-.02em;margin:0}
.mut{color:var(--mut);font-size:13px}
.hero{margin:4px 0 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 16px}
button{font:inherit;color:var(--ink);border:0;background:var(--btn);border-radius:10px;min-height:36px;min-width:40px;padding:0 12px}
button:active{opacity:.6}
button:focus-visible,summary:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.chip{border-radius:999px;font-size:14px;min-height:38px;white-space:nowrap;border:2px solid transparent}
.chip.on{background:transparent;border-color:var(--sc,var(--ink));font-weight:600}
.chip[class*=" s"]::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sc);margin-right:6px}
.s1{--sc:var(--c1)}.s2{--sc:var(--c2)}.s3{--sc:var(--c3)}.s4{--sc:var(--c4)}.s5{--sc:var(--c5)}
.grp{margin:0 0 28px}
.gh{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;color:var(--mut);padding-bottom:4px;border-bottom:1px solid var(--line)}
.gh span:first-child{min-width:0}
.gh span:last-child{white-space:nowrap}
.gh span:first-child::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sc);margin-right:7px}
.task{display:flex;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.chk{width:46px;min-width:46px;height:56px;background:none;padding:0;display:grid;place-items:center;border-radius:0;justify-items:start}
.c{color:var(--on-acc);width:24px;height:24px;border-radius:50%;border:2px solid var(--sc);display:grid;place-items:center;transition:background .15s}
.c svg{opacity:0;transition:opacity .15s}
.fin .c{background:var(--sc)}
.fin .c svg{opacity:1}
.body{flex:1;min-width:0;text-align:left;background:none;border-radius:0;padding:10px 0;min-height:56px}
.tn{font-size:18px;overflow-wrap:anywhere}
.ts{font-size:13px;color:var(--mut)}
.fin .tn{text-decoration:line-through;color:var(--mut)}
.stp{width:100%;display:flex;flex-wrap:wrap;gap:8px;padding:0 0 12px 46px}
.empty{text-align:center;padding:48px 0;color:var(--mut)}
details{margin-top:8px;color:var(--mut)}
summary{font-size:14px;min-height:44px;padding:10px 0}
.cmp .task{opacity:.9}
.set .sec{margin:6px 0 18px}
.set b{color:var(--ink);font-size:15px}
input[type=password],textarea{width:100%;font:16px monospace;background:var(--btn);color:var(--ink);border:0;border-radius:10px;padding:10px;margin:8px 0}
textarea{height:90px}
.ctl{display:flex;gap:8px;flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<h1>Today</h1>
<div class="hero mut" id="hero"></div>
<div class="chips" id="chips"></div>
<div id="app"></div>
<details class="set"><summary>Settings: sync and backup</summary>
<div class="sec"><b>Sync between devices</b>
<p class="mut" id="syncmsg">Not connected. Progress is saved on this device only.</p>
<div id="syncform"><input id="tok" type="password" autocomplete="off" placeholder="GitHub token (gist scope only)" aria-label="GitHub token"><div class="ctl"><button type="button" id="con">Connect</button></div>
<p class="mut">Create a classic token at github.com/settings/tokens with only the “gist” scope, then paste it here on every device.</p></div>
<div id="syncon" class="ctl" hidden><button type="button" id="now">Sync now</button><button type="button" id="dis">Disconnect</button></div></div>
<div class="sec"><b>Backup</b>
<textarea id="bk" aria-label="Backup text" placeholder="Backup text appears here"></textarea>
<div class="ctl"><button type="button" id="exp">Show backup</button><button type="button" id="imp">Restore</button><button type="button" id="clr">Clear today</button></div></div>
</details>
<script src="data.js"></script>
<script>
if (typeof DATA === "undefined") {
  document.getElementById("app").innerHTML = '<div class="empty">data.js is missing.<br>Upload it to the repo next to index.html.</div>';
  throw new Error("data.js missing");
}
const KEY = "abhyasa-v5";
const isWeak = t => (st.weak && t.id in st.weak) ? st.weak[t.id] : t.weak;      // your own flag wins over the plan's
const byOrder = (a,b) => isWeak(b) - isWeak(a) || a.order - b.order || a.id - b.id;   // weak topics first
const topicsOf = s => DATA.topics.filter(t => t.src === s.id).sort(byOrder);
const topicById = Object.create(null); DATA.topics.forEach(t => topicById[t.id] = t);

// Saved state: {v:5, log:{"YYYY-MM-DD":{topicId:unitsDone}}, ts:lastChange}
function clean(o){            // keep what still matches the plan; drop unknown topics, clamp to chapter size
  if (!o || o.v !== 5 || !o.log || typeof o.log !== "object" || Array.isArray(o.log)) return null;
  const out = {v:5, log:{}, ts: Number.isFinite(o.ts) ? o.ts : 0, weak:{}};
  if (o.weak && typeof o.weak === "object") Object.keys(o.weak).forEach(id => { if (topicById[id] && (o.weak[id] === 0 || o.weak[id] === 1)) out.weak[id] = o.weak[id]; });
  Object.keys(o.log).forEach(d => { const x = o.log[d];
    if (!/^\d{4}-\d\d-\d\d$/.test(d) || !x || typeof x !== "object" || Array.isArray(x)) return;
    Object.keys(x).forEach(id => { const t = topicById[id];
      if (t && Number.isInteger(x[id]) && x[id] > 0) (out.log[d] || (out.log[d] = {}))[id] = Math.min(x[id], t.units); }); });
  return out;
}
let st = {v:5, log:{}, ts:0, weak:{}};
try { const c = clean(JSON.parse(localStorage.getItem(KEY))); if (c) st = c; } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) {} };

const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const day = s => new Date(s+"T00:00:00");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const exam = day(DATA.exam.date);
const studyEnd = new Date(exam); studyEnd.setDate(exam.getDate() - DATA.exam.revisionDays);
let today = iso(new Date());
const tick = () => { today = iso(new Date()); };
const tdy = t => (st.log[today] || {})[t.id] || 0;
const before = t => Object.keys(st.log).reduce((a,d) => d === today ? a : a + (st.log[d][t.id] || 0), 0);

let view = "all"; try { view = localStorage.getItem("abhyasa-view") || "all"; } catch(e) {}
let prevIds = null, popId = null; const expanded = {};
const CHECK = '<svg viewBox="0 0 24 24" width="16" height="16"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function render(){
  tick();
  if (view !== "all" && !DATA.subjects.some(s => String(s.id) === view)) view = "all";
  const left = Math.round((day(iso(studyEnd)) - day(today)) / 864e5) + 1;   // today counts
  const toExam = Math.round((exam - day(today)) / 864e5);
  // ahead/behind: progress compared with an even pace from the plan's start date to the end of study
  const startD = day(DATA.exam.start || today);
  const total = Math.max(1, Math.round((studyEnd - startD) / 864e5) + 1);
  const elapsed = Math.min(total, Math.max(0, Math.round((day(today) - startD) / 864e5)));   // days finished before today
  const pace = f => { const d = Math.round((f - elapsed / total) * total); return d >= 1 ? d+"d ahead" : d <= -1 ? (-d)+"d behind" : "on track"; };
  let frac = 0;
  DATA.sources.forEach(s => { const ts = topicsOf(s); frac += ts.reduce((a,t) => a + before(t) + tdy(t), 0) / ts.reduce((a,t) => a + t.units, 0); });
  const items = [];
  DATA.sources.forEach(s => {
    if (view !== "all" && String(s.sub) !== view) return;
    const ts = topicsOf(s);
    const rem = Math.max(0, ts.reduce((a,t) => a + t.units - before(t), 0));   // left at the start of today
    const target = left < 1 ? rem : Math.ceil(rem / left);
    if (target > 0) items.push({s, ts});
  });
  items.sort((a,z) => a.s.sub - z.s.sub || a.s.id - z.s.id);

  let html = "", fin = "", nFin = 0, nOpen = 0; const ids = new Set();
  const row = (t, s, isDone, d) => {
    ids.add(t.id);
    return '<div class="task s'+s.sub+(isDone ? ' fin' : '')+'"><button type="button" class="chk" data-a="chk" data-t="'+t.id+'" aria-label="'+(isDone ? 'Mark not done: ' : 'Mark done: ')+esc(t.name)+'"><span class="c">'+CHECK+'</span></button>'
      +'<button type="button" class="body" data-a="exp" data-t="'+t.id+'" aria-expanded="'+!!expanded[t.id]+'"><div class="tn">'+esc(t.name)+(isWeak(t) ? ' · weak' : '')+'</div>'
      +'<div class="ts">'+(isDone ? esc(s.name)+' · completed' : d+' / '+t.units+' '+s.unit+'s')+'</div></button>'
      +(!isDone && expanded[t.id] ? '<div class="stp"><button type="button" data-a="step" data-t="'+t.id+'" data-v="-1" aria-label="Remove one">−</button>'
        +'<button type="button" data-a="step" data-t="'+t.id+'" data-v="1" aria-label="Add one">+1</button>'
        +(t.units > 5 ? '<button type="button" data-a="step" data-t="'+t.id+'" data-v="5" aria-label="Add five">+5</button>' : '')
        +'<button type="button" data-a="weak" data-t="'+t.id+'">'+(isWeak(t) ? 'Not weak' : 'Mark weak')+'</button></div>' : '')
      +'</div>';
  };
  items.forEach(({s, ts}) => {
    const all = ts.reduce((a,t) => a + t.units, 0), got = ts.reduce((a,t) => a + before(t) + tdy(t), 0);   // whole source
    let open = 0, rows = "";
    ts.forEach(t => {            // next two unfinished chapters; chapters finished today go to "Completed"
      const d = before(t) + tdy(t);
      if (d >= t.units) { if (before(t) < t.units) { fin += row(t, s, true, d); nFin++; } return; }
      if (open >= 2) return;
      open++; rows += row(t, s, false, d);
    });
    if (rows) { nOpen++; html += '<div class="grp s'+s.sub+'"><div class="gh"><span>'+esc(s.name)+'</span><span>'+Math.floor(got / all * 100)+'% · '+pace(got / all)+'</span></div>'+rows+'</div>'; }
  });
  if (!items.length) html = '<div class="empty">Nothing due today.</div>';
  else if (!nOpen) html = '<div class="empty">All done for today.</div>';
  if (nFin) html += '<details class="cmp"><summary>Completed · '+nFin+'</summary>'+fin+'</details>';
  document.getElementById("app").innerHTML = html;
  document.getElementById("hero").textContent = DATA.exam.name+" · "+toExam+" days left · "+pace(frac / DATA.sources.length);
  document.getElementById("chips").innerHTML = '<button type="button" class="chip'+(view === "all" ? ' on' : '')+'" data-a="view" data-v="all">All</button>'
    + DATA.subjects.map(sj => '<button type="button" class="chip s'+sj.id+(String(sj.id) === view ? ' on' : '')+'" data-a="view" data-v="'+sj.id+'">'+esc(sj.name)+'</button>').join("");
  prevIds = ids; popId = null;
}

// ---------- sync through a private GitHub gist (one JSON file) ----------
const SK = "abhyasa-sync", DK = "abhyasa-dirty", FILE = "abhyasa.json", DESC = "abhyasa-progress";
let sync = {}; try { sync = JSON.parse(localStorage.getItem(SK)) || {}; } catch(e) {}
let dirty = false; try { dirty = localStorage.getItem(DK) === "1"; } catch(e) {}
let rev = 0, busy = false, tm = null;
const $ = id => document.getElementById(id);
const setDirty = v => { dirty = v; try { localStorage.setItem(DK, v ? "1" : "0"); } catch(e) {} };
const saveSync = () => { try { localStorage.setItem(SK, JSON.stringify(sync)); } catch(e) {} };
const msg = t => { $("syncmsg").textContent = t; };
const ui = () => { $("syncform").hidden = !!sync.token; $("syncon").hidden = !sync.token; };
const schedule = () => { clearTimeout(tm); tm = setTimeout(doSync, 2000); };
function touch(){ st.ts = Date.now(); rev++; setDirty(true); save(); if (sync.token) schedule(); }
function merge(a, b){          // only used if two devices changed things before syncing: keep the larger count
  const out = {v:5, log:{}, ts: Math.max(a.ts || 0, b.ts || 0), weak: Object.assign({}, (a.ts || 0) >= (b.ts || 0) ? b.weak : a.weak, (a.ts || 0) >= (b.ts || 0) ? a.weak : b.weak)};
  [a, b].forEach(s => Object.keys(s.log).forEach(d => Object.keys(s.log[d]).forEach(id => {
    const o = out.log[d] || (out.log[d] = {}); o[id] = Math.max(o[id] || 0, s.log[d][id]); })));
  return out;
}
async function gh(path, opt){
  const r = await fetch("https://api.github.com"+path, Object.assign({}, opt, {headers:{Authorization:"Bearer "+sync.token, Accept:"application/vnd.github+json"}}));
  if (!r.ok) throw new Error(r.status === 401 ? "token rejected" : "GitHub error "+r.status);
  return r.json();
}
async function doSync(){
  if (!sync.token || busy) return;
  busy = true; msg("Syncing…");
  try {
    if (!sync.gist) {
      const list = await gh("/gists?per_page=100"), f = list.find(x => x.description === DESC && x.files && x.files[FILE]);
      if (f) sync.gist = f.id;
      else sync.gist = (await gh("/gists", {method:"POST", body:JSON.stringify({description:DESC, public:false, files:{[FILE]:{content:JSON.stringify(st)}}})})).id;
      saveSync();
    }
    const r0 = rev, g = await gh("/gists/"+sync.gist), file = g.files && g.files[FILE];
    let remote = null;
    try { remote = clean(JSON.parse(file.truncated ? await (await fetch(file.raw_url)).text() : file.content)); } catch(e) {}
    remote = remote || {v:5, log:{}, ts:0};
    const otherChanged = remote.ts !== (sync.last || 0);        // another device wrote since we last synced
    const next = dirty ? (otherChanged ? merge(st, remote) : st) : (remote.ts > (st.ts || 0) ? remote : st);
    const changed = JSON.stringify(next) !== JSON.stringify(st);
    st = next; save();
    if (JSON.stringify(remote) !== JSON.stringify(st))
      await gh("/gists/"+sync.gist, {method:"PATCH", body:JSON.stringify({files:{[FILE]:{content:JSON.stringify(st)}}})});
    sync.last = st.ts; saveSync();
    if (rev === r0) setDirty(false); else schedule();
    if (changed) render();
    msg("Synced "+new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}));
  } catch(e) { msg("Sync failed: "+e.message+". Tap Sync now to retry."); }
  finally { busy = false; }
}

// ---------- taps ----------
function onTap(e){
  const b = e.target.closest("[data-a]"); if (!b) return;
  const a = b.dataset.a;
  if (a === "view") { view = b.dataset.v; try { localStorage.setItem("abhyasa-view", view); } catch(e) {} render(); return; }
  tick();
  const t = topicById[b.dataset.t]; if (!t) return;
  if (a === "exp") { expanded[t.id] = !expanded[t.id]; render(); return; }
  if (a === "weak") { st.weak = st.weak || {}; st.weak[t.id] = isWeak(t) ? 0 : 1; touch(); render(); return; }
  const L = st.log[today] || (st.log[today] = {});
  const room = t.units - before(t);
  if (a === "chk") {
    const fin = before(t) + (L[t.id] || 0) >= t.units;
    L[t.id] = fin ? 0 : room;
    if (!fin && typeof navigator !== "undefined" && navigator.vibrate) navigator.vibrate(12);
  } else L[t.id] = Math.max(0, Math.min(room, (L[t.id] || 0) + +b.dataset.v));
  touch(); render();
}
$("app").addEventListener("click", onTap);
$("chips").addEventListener("click", onTap);

$("con").onclick = () => { const v = $("tok").value.trim(); if (!v) return; sync = {token:v}; saveSync(); $("tok").value = ""; setDirty(true); ui(); doSync(); };
$("dis").onclick = () => { sync = {}; saveSync(); ui(); msg("Not connected. Progress is saved on this device only."); };
$("now").onclick = () => doSync();
const bk = $("bk");
$("exp").onclick = () => { bk.value = JSON.stringify(st); bk.focus(); bk.select(); };
$("imp").onclick = () => {
  let o; try { o = JSON.parse(bk.value); } catch(e) {}
  o = clean(o);
  if (!o) { bk.value = "That text is not a valid backup for this plan."; return; }
  if (!confirm("Replace all progress saved in this browser?")) return;
  st = o; touch(); render(); bk.value = "Restored.";
};
$("clr").onclick = () => { if (confirm("Clear everything logged today?")) { delete st.log[today]; touch(); render(); } };
const wake = () => { render(); doSync(); };
document.addEventListener("visibilitychange", () => { if (!document.hidden) wake(); });
window.addEventListener("focus", wake);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});   // lets the page open offline
ui(); if (sync.token) msg("Connected."); render(); doSync();
</script>
</body>
</html>
