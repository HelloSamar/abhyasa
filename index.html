<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abhyasa</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mut:#8a8984;--acc:#1d6b4f;--bar:#e4e2da;--line:#eeece6;--btn:#efede6;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#141413;--card:#1e1e1c;--ink:#f0eee8;--mut:#9b9a93;--acc:#5fcf9f;--bar:#33322e;--line:#2c2b28;--btn:#2b2a27}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,system-ui,"Segoe UI",sans-serif;padding:14px 12px 40px;max-width:520px;margin:0 auto}
h1{font-size:24px;margin:2px 0 0}
.mut{color:var(--mut);font-size:13px}
.hero{margin:4px 0 14px}
.bar{height:4px;border-radius:2px;background:var(--bar);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.grp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 2px;margin-bottom:10px}
.gh{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;color:var(--mut)}
.gh b{color:var(--acc);white-space:nowrap}
button{font:inherit;color:var(--ink);border:0;background:var(--btn);border-radius:10px;min-height:36px;min-width:40px;padding:0 10px}
button:active{opacity:.6}
button:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.task{display:flex;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.chk{width:48px;min-width:48px;height:48px;background:none;padding:0;display:grid;place-items:center}
.c{width:26px;height:26px;border-radius:50%;border:2px solid var(--mut);display:grid;place-items:center;transition:background .2s,border-color .2s}
.c svg{opacity:0;transform:scale(.4);transition:opacity .2s,transform .2s}
.fin .c{background:var(--acc);border-color:var(--acc)}
.fin .c svg{opacity:1;transform:scale(1)}
.pop .c{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.3)}}
.in{animation:slide .28s ease-out}
@keyframes slide{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.body{flex:1;min-width:0;text-align:left;background:none;border-radius:0;padding:8px 0;min-height:48px}
.tn{font-weight:500;overflow-wrap:anywhere}
.ts{font-size:12px;color:var(--mut)}
.fin .tn{text-decoration:line-through;color:var(--mut)}
.stp{width:100%;display:flex;gap:6px;padding:0 0 10px 48px}
.empty{text-align:center;padding:28px 0;color:var(--mut)}
details.bk{margin-top:24px}
summary{font-weight:600;min-height:30px}
textarea{width:100%;height:90px;font:12px monospace;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;margin:8px 0}
.ctl{display:flex;gap:6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<h1>Today</h1>
<div class="hero" id="hero"></div>
<div id="app"></div>
<details class="bk">
<summary>Backup</summary>
<p class="mut">Progress lives only in this browser. Copy the backup text into Notes now and then.</p>
<textarea id="bk" aria-label="Backup text" placeholder="Backup text appears here"></textarea>
<div class="ctl"><button type="button" id="exp">Show backup</button><button type="button" id="imp">Restore</button><button type="button" id="clr">Clear today</button></div>
</details>
<script src="data.js"></script>
<script>
const KEY = "abhyasa-v5";
const byOrder = (a,b) => b.weak - a.weak || a.order - b.order || a.id - b.id;   // weak topics first
const topicsOf = s => DATA.topics.filter(t => t.src === s.id).sort(byOrder);
const topicById = Object.create(null); DATA.topics.forEach(t => topicById[t.id] = t);

// Saved state: {v:5, log:{"YYYY-MM-DD":{topicId:unitsDone}}}
function valid(o){
  if (!o || o.v !== 5 || !o.log || typeof o.log !== "object" || Array.isArray(o.log)) return false;
  return Object.keys(o.log).every(d => { const x = o.log[d];
    return /^\d{4}-\d\d-\d\d$/.test(d) && x && typeof x === "object" && !Array.isArray(x) &&
      Object.keys(x).every(id => topicById[id] && Number.isInteger(x[id]) && x[id] >= 0 && x[id] <= topicById[id].units); });
}
let st = {v:5, log:{}};
try { const s = JSON.parse(localStorage.getItem(KEY)); if (valid(s)) st = s; } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) {} };

const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const day = s => new Date(s+"T00:00:00");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => d.toLocaleDateString(undefined, {day:"numeric", month:"short", year:"numeric"});
const exam = day(DATA.exam.date);
const studyEnd = new Date(exam); studyEnd.setDate(exam.getDate() - DATA.exam.revisionDays);
let today = iso(new Date());
const tick = () => { today = iso(new Date()); };
const tdy = t => (st.log[today] || {})[t.id] || 0;
const before = t => Object.keys(st.log).reduce((a,d) => d === today ? a : a + (st.log[d][t.id] || 0), 0);

let prevIds = null, popId = null; const expanded = {};
const CHECK = '<svg viewBox="0 0 24 24" width="16" height="16"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function render(){
  tick();
  const left = Math.round((day(iso(studyEnd)) - day(today)) / 864e5) + 1;   // today counts
  const toExam = Math.round((exam - day(today)) / 864e5);
  const items = [];
  DATA.sources.forEach(s => {
    const ts = topicsOf(s);
    const rem = Math.max(0, ts.reduce((a,t) => a + t.units - before(t), 0));   // left at the start of today
    const target = left < 1 ? rem : Math.ceil(rem / left);
    const done = ts.reduce((a,t) => a + tdy(t), 0);
    if (target > 0) items.push({s, ts, target, done});
  });
  items.sort((a,z) => (a.done >= a.target) - (z.done >= z.target) || a.s.id - z.s.id);

  let tT = 0, tD = 0, html = ""; const ids = new Set();
  items.forEach(({s, ts, target, done}) => {
    tT += target * s.mpu; tD += Math.min(done, target) * s.mpu;
    const u = s.unit + "s";
    let open = 0, rows = "";
    ts.forEach(t => {            // finished today (marked) + the next two unfinished, in order
      const d = before(t) + tdy(t), isDone = d >= t.units;
      if (isDone ? before(t) >= t.units : open >= 2) return;
      if (!isDone) open++;
      ids.add(t.id);
      const cls = 'task'+(isDone ? ' fin' : '')+(t.id === popId ? ' pop' : '')+(prevIds && !prevIds.has(t.id) ? ' in' : '');
      rows += '<div class="'+cls+'"><button type="button" class="chk" data-a="chk" data-t="'+t.id+'" aria-label="'+(isDone ? 'Mark not done: ' : 'Mark done: ')+esc(t.name)+'"><span class="c">'+CHECK+'</span></button>'
        +'<button type="button" class="body" data-a="exp" data-t="'+t.id+'" aria-expanded="'+!!expanded[t.id]+'"><div class="tn">'+esc(t.name)+(t.weak ? ' · weak' : '')+'</div>'
        +'<div class="ts">'+(isDone ? 'completed · ' : '')+d+' / '+t.units+' '+u+'</div></button>'
        +(expanded[t.id] ? '<div class="stp"><button type="button" data-a="step" data-t="'+t.id+'" data-v="-1" aria-label="Remove one">−</button>'
          +'<button type="button" data-a="step" data-t="'+t.id+'" data-v="1" aria-label="Add one">+1</button>'
          +(t.units > 5 ? '<button type="button" data-a="step" data-t="'+t.id+'" data-v="5" aria-label="Add five">+5</button>' : '')+'</div>' : '')
        +'</div>';
    });
    const pct = Math.min(100, Math.round(done / target * 100));
    html += '<div class="grp"><div class="gh"><span>'+esc(s.name)+'</span><b>'+done+' / '+target+' '+u+'</b></div>'
      +'<div class="bar"><i style="width:'+pct+'%"></i></div>'+rows+'</div>';
  });
  if (!items.length) html = '<div class="empty">Nothing due today.</div>';
  const p = items.length ? Math.round(items.reduce((a,x) => a + Math.min(100, x.done / x.target * 100), 0) / items.length) : 100;
  document.getElementById("app").innerHTML = html;
  document.getElementById("hero").innerHTML =
    '<div class="mut">'+esc(DATA.exam.name)+' · '+toExam+' days to '+fmt(exam)+' · '+(left < 1 ? 'revision &amp; mocks' : 'study ends '+fmt(studyEnd))+'</div>'
    +'<div class="bar"><i style="width:'+p+'%"></i></div><div class="mut">'+tD+' of '+tT+' min today</div>';
  prevIds = ids; popId = null;
}

document.getElementById("app").addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  tick();
  const t = topicById[b.dataset.t]; if (!t) return;
  const a = b.dataset.a;
  if (a === "exp") { expanded[t.id] = !expanded[t.id]; render(); return; }
  const L = st.log[today] || (st.log[today] = {});
  const room = t.units - before(t);
  if (a === "chk") {
    const fin = before(t) + (L[t.id] || 0) >= t.units;
    L[t.id] = fin ? 0 : room;
    if (!fin) { popId = t.id; if (typeof navigator !== "undefined" && navigator.vibrate) navigator.vibrate(12); }
  } else L[t.id] = Math.max(0, Math.min(room, (L[t.id] || 0) + +b.dataset.v));
  save(); render();
});

const bk = document.getElementById("bk");
document.getElementById("exp").onclick = () => { bk.value = JSON.stringify(st); bk.focus(); bk.select(); };
document.getElementById("imp").onclick = () => {
  let o; try { o = JSON.parse(bk.value); } catch(e) {}
  if (!valid(o)) { bk.value = "That text is not a valid backup for this plan."; return; }
  if (!confirm("Replace all progress saved in this browser?")) return;
  st = o; save(); render(); bk.value = "Restored.";
};
document.getElementById("clr").onclick = () => { if (confirm("Clear everything logged today?")) { delete st.log[today]; save(); render(); } };
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
window.addEventListener("focus", render);
render();
</script>
</body>
</html>
