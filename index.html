<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abhyasa</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mut:#6b6a65;--acc:#1d6b4f;--bar:#e4e2da;--line:#e8e6df;--btn:#efede6;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#141413;--card:#1e1e1c;--ink:#f0eee8;--mut:#9b9a93;--acc:#5fcf9f;--bar:#33322e;--line:#2c2b28;--btn:#2b2a27}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;padding:16px 14px 40px;max-width:520px;margin:0 auto}
h1{font-size:22px;margin:4px 0 0}
.tag{color:var(--mut);font-size:13px;margin:0 0 4px}
.date{color:var(--mut);font-size:14px;margin:0 0 14px}
.cat{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:20px 2px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.src{font-weight:600;font-size:17px}
.due{font-size:12px;color:var(--mut);text-align:right}
.target{margin:8px 0 6px;font-size:15px}
.target b{color:var(--acc);font-size:20px}
.bar{height:8px;border-radius:4px;background:var(--bar);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.topic{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.tname{font-size:15px}
.tname span{color:var(--mut);font-size:12px;margin-right:4px}
.meta{font-size:12px;color:var(--mut);margin:2px 0 8px}
.ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
button{font:inherit;background:var(--btn);color:var(--ink);border:0;border-radius:10px;min-width:44px;height:44px;padding:0 12px}
button:active{opacity:.6}
.n{min-width:44px;text-align:center;font-weight:600}
.lbl{font-size:12px;color:var(--mut);margin-left:4px}
.done{opacity:.55}
.reset{margin-top:8px;width:100%;color:var(--mut)}
</style>
</head>
<body>
<h1>Abhyasa</h1>
<p class="tag">Practice. Prepare. Perform.</p>
<p class="date" id="date"></p>
<div id="app"></div>
<button class="reset" id="reset">Clear today’s log</button>

<script>
// ---- Edit your data here (same as seed.sql) ----
const DATA = {
  categories: [{id:1,name:"Maths"},{id:2,name:"English"}],
  sources: [
    {id:1,cat:1,name:"Quant Book",due:"2026-12-31"},
    {id:2,cat:1,name:"Maths Videos",due:"2027-01-15"},
    {id:3,cat:2,name:"Grammar PDF",due:"2026-12-20"}
  ],
  topics: [
    {id:1,src:1,name:"Percentages",pages:40,videos:null,mocks:2,order:1},
    {id:2,src:1,name:"Ratio",pages:35,videos:null,mocks:1,order:2},
    {id:3,src:2,name:"Algebra",pages:null,videos:25,mocks:3,order:1},
    {id:4,src:3,name:"Tenses",pages:30,videos:null,mocks:2,order:1},
    {id:5,src:3,name:"Articles",pages:18,videos:null,mocks:1,order:2}
  ]
};
// ------------------------------------------------

const KEY = "abhyasa-v1";
let st = {log:{}, mocks:{}};
try { st = JSON.parse(localStorage.getItem(KEY)) || st; } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) {} }

const pad = n => String(n).padStart(2,"0");
const now = new Date();
const today = now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate());
document.getElementById("date").textContent =
  now.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric"});

const total = t => t.pages != null ? t.pages : t.videos;
const unit = t => t.pages != null ? "pages" : "videos";
const logOf = d => st.log[d] || (st.log[d] = {});
const todayDone = t => logOf(today)[t.id] || 0;
const before = t => Object.keys(st.log).reduce((s,d) => d===today ? s : s+(st.log[d][t.id]||0), 0);
const daysLeft = due => {
  const a = new Date(today+"T00:00:00"), b = new Date(due+"T00:00:00");
  return Math.round((b-a)/864e5)+1;
};

// order like the SQL: category, source, topic_order
const srcs = DATA.sources.slice().sort((a,b) =>
  DATA.categories.findIndex(c=>c.id===a.cat) - DATA.categories.findIndex(c=>c.id===b.cat) || a.id-b.id);
const num = {}, cnt = {};
srcs.forEach(s => DATA.topics.filter(t=>t.src===s.id).sort((a,b)=>a.order-b.order||a.id-b.id)
  .forEach(t => { cnt[s.cat]=(cnt[s.cat]||0)+1; num[t.id]=cnt[s.cat]; }));

function render(){
  let html = "", lastCat = null;
  srcs.forEach(s => {
    if (s.cat !== lastCat) {
      html += '<div class="cat">'+DATA.categories.find(c=>c.id===s.cat).name+'</div>';
      lastCat = s.cat;
    }
    const ts = DATA.topics.filter(t=>t.src===s.id).sort((a,b)=>a.order-b.order||a.id-b.id);
    const tot = ts.reduce((a,t)=>a+total(t),0);
    const bef = ts.reduce((a,t)=>a+before(t),0);
    const tdy = ts.reduce((a,t)=>a+todayDone(t),0);
    const left = daysLeft(s.due);
    const target = Math.min(tot-bef, Math.ceil((tot-bef)/Math.max(1,left)));
    const pct = target > 0 ? Math.min(100, Math.round(tdy/target*100)) : 100;
    const dueTxt = left < 1 ? "Overdue" : left+" day"+(left===1?"":"s")+" left";
    html += '<div class="card"><div class="row"><div class="src">'+s.name+'</div>'
      +'<div class="due">'+s.due+'<br>'+dueTxt+'</div></div>'
      +'<div class="target">Today’s target: <b>'+target+'</b> · done <b>'+tdy+'</b></div>'
      +'<div class="bar"><i style="width:'+pct+'%"></i></div>';
    ts.forEach(t => {
      const d = before(t)+todayDone(t), fin = d >= total(t);
      const m = st.mocks[t.id]||0;
      html += '<div class="topic'+(fin?' done':'')+'"><div class="tname"><span>#'+num[t.id]+'</span>'+t.name+'</div>'
        +'<div class="meta">'+d+' / '+total(t)+' '+unit(t)+' · mocks '+m+' / '+t.mocks+'</div>'
        +'<div class="ctl">'
        +'<button data-a="u" data-t="'+t.id+'" data-v="-1">−</button>'
        +'<span class="n">'+todayDone(t)+'</span>'
        +'<button data-a="u" data-t="'+t.id+'" data-v="1">+1</button>'
        +'<button data-a="u" data-t="'+t.id+'" data-v="5">+5</button>'
        +'<span class="lbl">today</span></div>'
        +'<div class="ctl" style="margin-top:6px">'
        +'<button data-a="m" data-t="'+t.id+'" data-v="-1">−</button>'
        +'<span class="n">'+m+'</span>'
        +'<button data-a="m" data-t="'+t.id+'" data-v="1">+</button>'
        +'<span class="lbl">mock tests</span></div></div>';
    });
    html += '</div>';
  });
  document.getElementById("app").innerHTML = html;
}

document.getElementById("app").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const t = DATA.topics.find(x => x.id === +b.dataset.t), v = +b.dataset.v;
  if (b.dataset.a === "u") {
    const max = total(t) - before(t);
    logOf(today)[t.id] = Math.max(0, Math.min(max, todayDone(t)+v));
  } else {
    st.mocks[t.id] = Math.max(0, Math.min(t.mocks, (st.mocks[t.id]||0)+v));
  }
  save(); render();
});
document.getElementById("reset").onclick = () => {
  if (confirm("Clear everything logged today?")) { st.log[today] = {}; save(); render(); }
};
render();
</script>
</body>
</html>
